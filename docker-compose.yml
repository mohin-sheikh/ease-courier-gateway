version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ease-courier-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ease_courier_gateway

    ports:
      - '5434:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - ease-courier-network

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ease-courier-redis

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - yes
      - --requirepass
      - redis123

    ports:
      - '6380:6379'

    volumes:
      - redis_data:/data

    networks:
      - ease-courier-network

    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redis123', 'PING']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  ease-courier-network:
    driver: bridge
